name: M7 Health
description: 'M7 Health is an AI-powered workforce operations platform for healthcare,
  focused on nurse scheduling and labor optimization. The platform forecasts staffing
  demand, auto-balances schedules, fills open shifts, and deploys staff to close coverage
  gaps while reducing premium labor spend, administrative burden, and nurse turnover
  across hospitals and health systems. Surfaced as a portfolio company of threshold-ventures
  and enriched by the API Evangelist pipeline; no public developer or API surface was
  found — the product is delivered as an enterprise SaaS engaged via a sales demo.'
